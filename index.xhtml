*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}

.row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:none}
.row.done .nm{text-decoration:line-through;color:var(--mut)}
.chk{flex:0 0 auto;width:22px;height:22px;border:2px solid var(--amber2);border-radius:7px;margin-top:3px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#0e1f19;font-weight:700}
.chk.on{background:var(--amber2)}
.nm{flex:1}
.nm b{color:#f5efe0}
.nm .note{display:block;font-size:12.5px;color:var(--mut);margin-top:2px}
.t{flex:0 0 auto;font-variant-numeric:tabular-nums;color:#f0a050;font-size:13.5px;margin-top:3px;width:44px;text-align:right}
.big{font-size:19px;font-weight:700;color:#f5efe0;line-height:1.5}
.big .hl{color:#f0a050}
.sub{font-size:12.5px;color:var(--mut)}
.pill{display:inline-block;background:rgba(240,160,80,.15);color:#f0a050;border-radius:999px;padding:2px 10px;font-size:12px;margin:2px 4px 2px 0}
.pill.g{background:rgba(87,179,128,.15);color:#57b380}
.pill.b{background:rgba(120,160,220,.15);color:#8fb0e0}
.btn{display:inline-block;background:var(--amber2);color:#1b1005;border-radius:10px;padding:8px 14px;font-size:13.5px;font-weight:600;text-decoration:none;margin:4px 6px 0 0;border:none}
.btn.ghost{background:transparent;border:1px solid var(--amber2);color:#f0a050}
.btn.gray{background:#26463c;color:#cfe0d5;border:none}
.alert{background:rgba(224,123,26,.12);border-left:3px solid var(--amber2);border-radius:8px;padding:9px 12px;margin:8px 0;font-size:13.5px}
.alert.red{border-left-color:var(--red);background:rgba(224,123,90,.1)}
.alert.ok{border-left-color:var(--ok);background:rgba(87,179,128,.1)}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:60;background:#122a22;display:flex;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(0,0,0,.4)}
.tabs button{flex:1;background:none;border:none;color:var(--mut);font-size:11px;padding:8px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
.tabs button .ic{font-size:20px;line-height:1}
.tabs button.on{color:#f0a050;font-weight:600}
.page{display:none}
.page.on{display:block}
.kv{display:flex;gap:8px;padding:6px 0;font-size:13.5px;border-bottom:1px dashed var(--line)}
.kv:last-child{border:none}
.kv .k{flex:0 0 74px;color:var(--mut)}
.prog{background:#26463c;border-radius:999px;height:10px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--amber2),var(--amber));border-radius:999px}
svg text{font-family:inherit}
svg .node-hit{cursor:pointer}
.info{background:var(--card2);border-radius:12px;padding:12px;margin-top:10px;font-size:13.5px}
.hidden{display:none!important}
h2.sec{font-size:14px;color:var(--mut);margin:18px 14px 4px;letter-spacing:2px}
</style>
</head>

/* ============ 状态 ============ */
const LSK="dxal_v1_";
function load(k,d){try{const v=localStorage.getItem(LSK+k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(LSK+k,JSON.stringify(v))}catch(e){}}
let DONE=load("done",{});
let GEO=load("geo",{lat:null,lon:null,ts:null});
function toggleDone(k){DONE[k]=!DONE[k];if(!DONE[k])delete DONE[k];save("done",DONE);renderAll()}
function isDone(k){return !!DONE[k]}

/* ============ 工具 ============ */
function todayStr(){const d=new Date();const m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");return `2026-${m}-${dd}`}
function toMin(t){const p=t.split(":");return (+p[0])*60+(+p[1])}
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes()}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function amapSearch(kw){return "https://uri.amap.com/search?keyword="+encodeURIComponent(kw)}
function amapNav(name){return "https://uri.amap.com/search?keyword="+encodeURIComponent(name)}
function bing(q){return "https://www.bing.com/search?q="+encodeURIComponent(q)}
function meituan(town){return bing(town+" 美团 美食")}
function hav(lat1,lon1,lat2,lon2){const R=6371,d=Math.PI/180;const a=Math.sin((lat2-lat1)*d/2)**2+Math.cos(lat1*d)*Math.cos(lat2*d)*Math.sin((lon2-lon1)*d/2)**2;return 2*R*Math.asin(Math.sqrt(a))}
function dayByDate(ds){return DAYS.find(x=>x.date===ds)}
function todayIdx(){const i=DAYS.findIndex(x=>x.date===todayStr());return i>=0?i:null}

/* ============ 今日页 ============ */
function renderToday(){
  const idx=todayIdx();const nc=document.getElementById("nowcard");
  let h="";
  if(idx===null){
    const st=new Date(TRIP_START),en=new Date(TRIP_END),now=new Date();
    if(now<st){const dd=Math.ceil((st-now)/864e5);h=`<div class="big">还有 <span class="hl">${dd}</span> 天出发</div><div class="sub">出发日 ${TRIP_START} 10:00 齐齐哈尔火车站取车。行前检查清单在「清单」页。</div>`}
    else{h=`<div class="big">行程已结束 🌲</div><div class="sub">10/5 已还车。补班日 10/10。下次再会，北纬53°。</div>`}
    nc.innerHTML=h;document.getElementById("alerts").innerHTML="";renderDay(null);renderStop(null);return;
  }
  const day=DAYS[idx];const nm=nowMin();
  let cur=day.items[0],next=null,allDone=true;
  day.items.forEach((it,i)=>{if(isDone(`${idx}_${i}`)){cur=day.items[Math.min(i+1,day.items.length-1)]}else{allDone=false}});
  for(let i=0;i<day.items.length;i++){if(!isDone(`${idx}_${i}`)){next=day.items[i];break}}
  if(!next)next={t:day.set,n:"今天全部完成，早点休息"};
  const setMin=toMin(day.set),left=setMin-nm;
  const timeStr=new Date().toTimeString().slice(0,5);
  h=`<div class="big">今天：${day.t}</div>
     <div class="sub">宿：${day.stay}｜日出${day.sun} 日落${day.set}｜建议起床 ${day.wake}</div>
     <div style="margin-top:8px" class="pill">现在 ${timeStr}</div>
     <span class="pill ${left>0?'':'b'}">距日落 ${left>0?Math.floor(left/60)+"h"+String(left%60).padStart(2,"0")+"m":"已天黑"}</span>
     <span class="pill ${allDone?'g':''}">${allDone?"今日已全部完成":"进行中"}</span>`;
  if(!allDone&&next&&next.n)h+=`<div class="alert">接下来：<b>${next.n}</b>${next.t?("（"+next.t+"）"):""}${next.note?"——"+next.note:""}</div>`;
  nc.innerHTML=h;
  // 提示引擎
  const al=[];
  if(left>0&&left<=90&&!allDone)al.push(`<div class="alert red">⏰ 距日落仅${Math.floor(left/60)}小时${left%60}分——日落红线17:30，若未到今晚住宿点请立即出发，17:00后降速20%。</div>`);
  if(idx===5){al.push(`<div class="alert">⛽ 今天满归<b>只加油不停留</b>，出发前务必满油；满归—漠河70–80km无信号（离线地图+卫星消息就绪）。20:00记得报平安。</div>`)}
  if(idx===6){al.push(`<div class="alert">🌅 明早还有九曲十八弯晨雾★★★——今晚漠河市区早睡，<b>明早5:30起床、6:00出发</b>。</div>`);if(nm>=(idx===6?19*60:0)){}
  }
  if(idx===3){al.push(`<div class="alert">🌄 明早<b>5:30起床</b>，日出前40分钟（约5:30）上临江后山占机位——全线最强晨景★★★。</div>`)}
  if(idx===1){al.push(`<div class="alert">📍 取车：绕车录像+油量拍照+确认随车三角牌；防冻玻璃水(-25℃)提车即换。</div>`)}
  if(idx===4){al.push(`<div class="alert">⛽ 今天开始执行“见站加满、半箱必加”（莫尔道嘎/金河/满归）。</div>`)}
  if(idx===9){al.push(`<div class="alert">🦩 扎龙放飞场次行前应已电话确认；下午到齐齐哈尔先去湿地，晚上烤肉收尾。</div>`)}
  if(!(navigator.onLine!==false))al.push(`<div class="alert red">📡 当前离线：知识库与清单可用，检索/导航按钮需信号恢复后使用。</div>`);
  if(GEO.lat!==null&&next&&next.n){
    // 找下一站的坐标做距离估算
    const cand=NODES.find(n=>next.n.indexOf(n.n)>-1)||NODES.find(n=>day.stay.indexOf(n.n)>-1);
    if(cand&&GEO.lat){const km=hav(GEO.lat,GEO.lon,cand.lat,cand.lon);al.push(`<div class="alert ok">📍 定位：距「${cand.n}」直线约 <b>${km.toFixed(0)} km</b>${km>80?"（注意长途驾驶节奏，每2小时休息）":""}。</div>`)}
  }
  document.getElementById("alerts").innerHTML=al.join("");
  renderDay(idx);
  renderStop(idx);
  renderQuick(idx,day);
}
function renderDay(idx){
  const el=document.getElementById("todaycard");
  if(idx===null){el.innerHTML="<h3>今日行程</h3><p class='sub'>不在行程日期内。</p>";return}
  const day=DAYS[idx];
  let h=`<h3>${day.t}（宿：${day.stay}）</h3>`;
  h+=`<div class="sub">起床建议 ${day.wake} ｜ 日出${day.sun} 日落${day.set}</div>`;
  day.items.forEach((it,i)=>{
    const k=`${idx}_${i}`,on=isDone(k);
    h+=`<div class="row ${on?'done':''}"><div class="chk ${on?'on':''}" onclick="toggleDone('${k}')">${on?'✓':''}</div><div class="nm"><b>${it.n}</b><span class="note">${it.note||""}</span></div><div class="t">${it.t}</div></div>`;
  });
  if(day.alt)h+=`<div class="sub">备选：${day.alt}</div>`;
  el.innerHTML=h;
}
function renderStop(idx){
  const el=document.getElementById("foodcard"),cu=document.getElementById("culturecard");
  if(idx===null){el.style.display="none";cu.style.display="none";return}
  const day=DAYS[idx];
  el.style.display="";cu.style.display="";
  const town=day.stay.split("·")[0];
  el.innerHTML=`<h3>🍽️ 今天吃什么</h3><p>${day.food}</p>
   <a class="btn" href="${amapSearch(town+" 美食")}" target="_blank">高德搜周边美食</a>
   <a class="btn ghost" href="${meituan(town)}" target="_blank">点评搜索</a>`;
  cu.innerHTML=`<h3>📖 这里的人文</h3><p>${day.cul}</p>
   <a class="btn ghost" href="${bing(town+" 历史 民俗")}" target="_blank">联网查更多典故</a>
   <a class="btn ghost" href="${bing(town+" 天气")}" target="_blank">天气</a>`;
}
function renderQuick(idx,day){
  const q=document.getElementById("quick");
  const nextName=(function(){const i=DAYS.indexOf(day);const nx=DAYS[i+1];return nx?nx.stay.split("·")[0]:""})()||"下一站";
  q.innerHTML=`<a class="btn" href="${amapNav(day.stay.split("·")[0]+" 火车站")}" target="_blank">🧭 导航到今晚住宿</a>
  <a class="btn" href="${amapNav(nextName)}" target="_blank">🧭 导航到下一站（${nextName}）</a>
  <a class="btn ghost" href="${bing(day.stay.split("·")[0]+" 景点")}" target="_blank">🔎 周边景点检索</a>`;
}

/* ============ 行程页 ============ */
function renderPlan(){
  const el=document.getElementById("alldays");let h="",tot=0,dn=0;
  DAYS.forEach((day,di)=>{
    let done=0;day.items.forEach((it,i)=>{tot++;if(isDone(`${di}_${i}`)){done++;dn++}});
    const pct=day.items.length?Math.round(done/day.items.length*100):0;
    h+=`<div class="card"><h3>${day.t} · ${pct}%</h3><div class="prog"><i style="width:${pct}%"></i></div>
      <div class="sub">宿：${day.stay}</div>`;
    day.items.forEach((it,i)=>{const k=`${di}_${i}`,on=isDone(k);
      h+=`<div class="row ${on?'done':''}"><div class="chk ${on?'on':''}" onclick="toggleDone('${k}');renderPlan();renderToday()">${on?'✓':''}</div><div class="nm"><b>${it.n}</b><span class="note">${it.note||""}</span></div><div class="t">${it.t}</div></div>`});
    h+=`</div>`;
  });
  document.getElementById("progall").innerHTML=`<div class="big">总进度 <span class="hl">${tot?Math.round(dn/tot*100):0}%</span>（${dn}/${tot} 项）</div><div class="prog"><i style="width:${tot?dn/tot*100:0}%"></i></div>`;
  el.innerHTML=h;
}

/* ============ 地图页 ============ */
function renderMap(){
  const g=document.getElementById("mnodes");let h="";
  NODES.forEach((n,i)=>{
    const di=parseInt((n.day.match(/D(\d+)/)||[])[1]);
    const nightDone=di!==undefined&&!isNaN(di)&&!!DAYS[di]&&DAYS[di].items.some((it,j)=>isDone(di+"_"+j));
    h+=`<g class="node-hit" onclick="nodeTap(${i})">
      <circle cx="${n.x}" cy="${n.y}" r="13" fill="transparent"></circle>
      <circle cx="${n.x}" cy="${n.y}" r="${nightDone?6:5}" fill="${nightDone?'#f0a050':'#122a22'}" stroke="#f0a050" stroke-width="2.4"></circle>
      <text x="${n.x+11}" y="${n.y+5}" font-size="14" fill="#e8e4d8">${n.n}</text></g>`;
  });
  g.innerHTML=h;
}
function nodeTap(i){
  const n=NODES[i];const p=document.getElementById("mapinfo");p.style.display="block";
  const day=DAYS.find(d=>(d.t+n.n).length&&d.stay.indexOf(n.n)>-1)||DAYS.find(d=>JSON.stringify(d.items).indexOf(n.n)>-1);
  let food=day?day.food:"",cul=day?day.cul:"";
  p.innerHTML=`<b style="color:#f0a050">${n.n}</b> <span class="sub">（${n.day}）</span><br />${cul?cul+"<br />":""}${food?"🍽️ "+food:""}
   <div style="margin-top:6px"><a class="btn" href="${amapNav(n.n)}" target="_blank">🧭 高德导航</a>
   <a class="btn ghost" href="${bing(n.n+" 美食 民俗")}" target="_blank">🔎 联网检索</a></div>`;
}

/* ============ 清单页 ============ */
function renderList(){
  function ul(id,arr,pre){
    const st=load("list_"+id,{});
    const el=document.getElementById(id);let h="";
    arr.forEach((x,i)=>{const on=!!st[i];h+=`<li><div class="row ${on?'done':''}"><div class="chk ${on?'on':''}" onclick="toggleList('${id}',${i})">${on?'✓':''}</div><div class="nm">${x}</div></div></li>`});
    el.innerHTML=h;
  }
  ul("gear",GEAR);ul("docs",DOCS);ul("opts",OPTS);
}
function toggleList(id,i){const st=load("list_"+id,{});st[i]=!st[i];save("list_"+id,st);renderList()}

/* ============ 定位 ============ */
function askGeo(){
  if(!navigator.geolocation){setGeoHint("此环境不支持定位（请用 Safari 打开线上网址）");return}
  navigator.geolocation.getCurrentPosition(function(p){
    GEO={lat:p.coords.latitude,lon:p.coords.longitude,ts:Date.now()};save("geo",GEO);
    setGeoHint(`定位成功：${p.coords.latitude.toFixed(3)}, ${p.coords.longitude.toFixed(3)}（精度${Math.round(p.coords.accuracy)}m）`);renderToday();
  },function(e){setGeoHint(e.code===1?"定位权限被拒绝：可在 Safari 设置→本网站→位置 中重新允许":"定位暂时不可用，可用「行程」页手动勾选进度")},{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
}
function setGeoHint(t){const el=document.getElementById("geoHint");if(el)el.textContent=t}
function geoCard(){
  const el=document.getElementById("nowcard");
  const gc=document.createElement("div");gc.className="card";gc.style.marginTop="0";
  gc.innerHTML=`<h3>📍 位置</h3><div class="sub" id="geoHint">${GEO.lat!==null?("最近一次定位："+GEO.lat.toFixed(3)+", "+GEO.lon.toFixed(3)):"尚未获取定位"}</div>
  <button class="btn" onclick="askGeo()">获取当前位置</button>
  <span class="sub">首次会弹出权限，请允许「位置」。</span>`;
  el.parentNode.insertBefore(gc,el.nextSibling);
}
